<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rehasport Kursplan</title>
<style>
/* Montserrat self-hosted, keine externe Verbindung */
@font-face { font-family: 'Montserrat'; font-weight: 400; font-display: swap; src: url('montserrat-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Montserrat'; font-weight: 500; font-display: swap; src: url('montserrat-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'Montserrat'; font-weight: 600; font-display: swap; src: url('montserrat-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family: 'Montserrat'; font-weight: 700; font-display: swap; src: url('montserrat-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Montserrat'; font-weight: 800; font-display: swap; src: url('montserrat-latin-800-normal.woff2') format('woff2'); }

:root {
  --font: 'Montserrat', 'Trebuchet MS', system-ui, sans-serif;
  --main: #626c61;
  --secondary: #8f9893;
  --gold: #c9a84c;
  --bg: #f0efea;
  --card: #ffffff;
  --card-soft: #f7f6f2;
  --line: #e0ddd6;
  --text: #2c2c2a;
  --muted: #7f837d;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { width: 100%; min-height: 100%; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

button { font-family: var(--font); }

.header {
  background: var(--main);
  padding: 1.5rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.header-left h1 {
  font-size: 2rem;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.5px;
  line-height: 1.05;
}

.header-left p {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.76);
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 4px;
}

.kursraum-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 999px;
  padding: 6px 13px;
  font-size: 0.72rem;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
}

.c-dot,
.room-badge {
  border-radius: 50%;
  background: var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  color: #fff;
  flex-shrink: 0;
}

.c-dot { width: 18px; height: 18px; font-size: 0.65rem; }
.room-badge { width: 16px; height: 16px; font-size: 0.5rem; }

.mobile-nav { display: none; }

.plan-wrapper {
  padding: 1.5rem;
  max-width: 1040px;
  margin: 0 auto;
}

.plan-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
}

.plan-single { display: none; }

.tag-spalte {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.tag-header {
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: var(--main);
  padding: 7px 8px;
  border-radius: 7px;
  text-align: center;
}

.tag-header.heute { background: var(--gold); }

.kurs-card {
  background: var(--card);
  border-radius: 10px;
  padding: 10px 11px;
  border: 1px solid var(--line);
  border-left: 4px solid var(--main);
  box-shadow: 0 6px 18px rgba(44, 44, 42, 0.04);
}

.kurs-card.nachmittag { border-left-color: var(--gold); }

.kurs-zeit {
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--main);
  margin-bottom: 4px;
}

.kurs-card.nachmittag .kurs-zeit { color: #9b7d28; }

.kurs-name {
  font-size: 0.74rem;
  font-weight: 800;
  color: var(--text);
  text-transform: uppercase;
  letter-spacing: 0.02em;
  line-height: 1.28;
  overflow-wrap: anywhere;
}

.kurs-trainer {
  font-size: 0.66rem;
  color: var(--muted);
  margin-top: 4px;
  font-weight: 500;
  line-height: 1.35;
}

.kurs-hinweis {
  font-size: 0.61rem;
  color: #9b7d28;
  margin-top: 3px;
  font-style: italic;
  line-height: 1.35;
}

.kurs-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}

.typ-badge {
  font-size: 0.58rem;
  font-weight: 800;
  padding: 3px 7px;
  border-radius: 999px;
  white-space: nowrap;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.b-r { background: #eef4f0; color: #3a5244; }
.b-o { background: #eef1ef; color: #4f5b52; }
.b-n { background: #f4efe4; color: #8a5a0a; }
.b-h { background: #f1f3f0; color: #626c61; }

.trennlinie {
  height: 1px;
  background: #e8e5de;
  border: none;
  margin: 3px 0;
}

.leer-tag {
  font-size: 0.76rem;
  color: var(--muted);
  text-align: center;
  padding: 1rem 0;
  font-weight: 600;
}

.laden {
  grid-column: 1 / -1;
  text-align: center;
  padding: 3rem;
  color: var(--muted);
  font-size: 0.85rem;
}

.legende {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 0 1.5rem 1.5rem;
  max-width: 1040px;
  margin: 0 auto;
}

.legende-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.63rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.legende-linie {
  width: 18px;
  height: 3px;
  border-radius: 2px;
}

@media (max-width: 899px) {
  .plan-wrapper { max-width: 760px; }
  .plan-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (max-width: 699px) {
  body { background: var(--bg); }

  .header {
    padding: 22px 20px;
    flex-direction: column;
    align-items: flex-start;
    gap: 15px;
  }

  .header-left h1 { font-size: 2rem; }

  .header-left p {
    font-size: 0.72rem;
    line-height: 1.45;
    max-width: 280px;
  }

  .kursraum-badge {
    font-size: 0.68rem;
    padding: 7px 12px;
    letter-spacing: 0.06em;
  }

  .mobile-nav {
    display: block;
    background: var(--secondary);
    padding: 16px 18px;
    color: #fff;
  }

  .mobile-nav-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    max-width: 520px;
    margin: 0 auto;
  }

  .mobile-tag-gross { min-width: 0; }

  .mobile-wochentag {
    font-size: 1.15rem;
    font-weight: 800;
    line-height: 1.1;
  }

  .mobile-datum {
    font-size: 0.82rem;
    font-weight: 600;
    opacity: 0.82;
    margin-top: 3px;
  }

  .mobile-kurs-anzahl {
    font-size: 0.72rem;
    font-weight: 600;
    opacity: 0.82;
    margin-top: 4px;
  }

  .mobile-nav-buttons {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
  }

  .nav-pfeil,
  .nav-heute {
    border: 1px solid rgba(255,255,255,0.28);
    background: rgba(255,255,255,0.14);
    color: #fff;
    border-radius: 999px;
    min-height: 36px;
    cursor: pointer;
    font-weight: 800;
  }

  .nav-pfeil {
    width: 36px;
    font-size: 1rem;
    line-height: 1;
  }

  .nav-heute {
    padding: 0 13px;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .nav-heute.aktiv-heute {
    background: var(--gold);
    border-color: var(--gold);
  }

  .nav-pfeil:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .plan-grid { display: none; }

  .plan-wrapper {
    padding: 22px 18px 28px;
    max-width: 520px;
  }

  .plan-single {
    display: block;
    width: 100%;
  }

  .plan-single .tag-spalte { gap: 12px; }

  .kurs-card {
    padding: 16px 16px;
    border-radius: 13px;
    border-left-width: 5px;
  }

  .kurs-zeit {
    font-size: 0.78rem;
    margin-bottom: 7px;
  }

  .kurs-name {
    font-size: 0.95rem;
    line-height: 1.35;
  }

  .kurs-trainer {
    font-size: 0.78rem;
    margin-top: 6px;
  }

  .kurs-hinweis { font-size: 0.72rem; }

  .kurs-footer { margin-top: 12px; }

  .typ-badge {
    font-size: 0.65rem;
    padding: 4px 9px;
  }

  .room-badge {
    width: 20px;
    height: 20px;
    font-size: 0.6rem;
  }

  .leer-tag {
    background: rgba(255,255,255,0.65);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.2rem;
  }

  .legende {
    max-width: 520px;
    padding: 0 18px 24px;
    gap: 10px;
  }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Rehasport</h1>
    <p>Kursplan · Stand Nov. 2025</p>
  </div>
  <div class="header-right">
    <div class="kursraum-badge">
      <div class="c-dot">C</div>
      Kursraum C · Etage 5
    </div>
  </div>
</div>

<div class="mobile-nav" id="mobileNav">
  <div class="mobile-nav-top">
    <div class="mobile-tag-gross">
      <div class="mobile-wochentag" id="mobileWochentag">Montag</div>
      <div class="mobile-datum" id="mobileDatum">–</div>
      <div class="mobile-kurs-anzahl" id="mobileAnzahl"></div>
    </div>
    <div class="mobile-nav-buttons">
      <button class="nav-pfeil" id="btnVor" onclick="navigiere(-1)" aria-label="Vorheriger Tag">←</button>
      <button class="nav-heute" id="btnHeute" onclick="zuHeute()">Heute</button>
      <button class="nav-pfeil" id="btnNach" onclick="navigiere(1)" aria-label="Nächster Tag">→</button>
    </div>
  </div>
</div>

<div class="plan-wrapper">
  <div class="plan-grid" id="planGrid">
    <div class="laden">Kurse werden geladen...</div>
  </div>
  <div class="plan-single" id="planSingle"></div>
</div>

<div class="legende">
  <div class="legende-item"><div class="legende-linie" style="background:#626c61"></div>Vormittag</div>
  <div class="legende-item"><div class="legende-linie" style="background:#c9a84c"></div>Nachmittag</div>
  <div class="legende-item"><span class="typ-badge b-r">Rücken</span></div>
  <div class="legende-item"><span class="typ-badge b-o">Orthogym</span></div>
  <div class="legende-item"><span class="typ-badge b-n">RNS</span></div>
  <div class="legende-item"><span class="typ-badge b-h">Hockergym</span></div>
</div>

<script>
const TAGE = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];
const WOCHENTAG_MAP = {1:'Montag',2:'Dienstag',3:'Mittwoch',4:'Donnerstag',5:'Freitag'};
let alleKurse = [];
let aktiverIndex = 0;

function htmlEscape(wert) {
  return String(wert ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function wert(k, namen) {
  for (const name of namen) {
    if (k && k[name] !== undefined && k[name] !== null && k[name] !== '') return k[name];
  }
  return '';
}

function normalisiereZeit(zeit) {
  const z = String(zeit ?? '').trim();
  if (!z) return '';
  if (/^\d{1}:\d{2}$/.test(z)) return '0' + z;
  return z;
}

function heuteIndex() {
  const tag = new Date().getDay();
  if (tag >= 1 && tag <= 5) return tag - 1;
  return 0;
}

function aktiverTag() { return TAGE[aktiverIndex]; }

function istVormittag(zeit) {
  if (!zeit) return true;
  const stunde = parseInt(String(zeit).split(':')[0], 10);
  return Number.isNaN(stunde) ? true : stunde < 13;
}

function tagVonKurs(k) {
  return wert(k, ['tag','Tag','wochentag','Wochentag']);
}

function updateMobileHeader() {
  const heute = new Date();
  const tagNr = heute.getDay();
  const diff = aktiverIndex - (tagNr === 0 ? 6 : tagNr - 1);
  const datum = new Date(heute);
  datum.setDate(heute.getDate() + diff);

  document.getElementById('mobileWochentag').textContent = TAGE[aktiverIndex];
  document.getElementById('mobileDatum').textContent =
    datum.getDate().toString().padStart(2,'0') + '.' +
    (datum.getMonth()+1).toString().padStart(2,'0');

  const anzahl = alleKurse.filter(k => tagVonKurs(k) === TAGE[aktiverIndex]).length;
  document.getElementById('mobileAnzahl').textContent =
    anzahl > 0 ? anzahl + ' Kurs' + (anzahl !== 1 ? 'e' : '') : 'Keine Kurse';

  const istHeute = aktiverIndex === heuteIndex() && tagNr >= 1 && tagNr <= 5;
  document.getElementById('btnHeute').className = 'nav-heute' + (istHeute ? ' aktiv-heute' : '');
  document.getElementById('btnVor').disabled = aktiverIndex === 0;
  document.getElementById('btnNach').disabled = aktiverIndex === 4;
}

function getBadge(typ) {
  const t = String(typ ?? '').toLowerCase();
  if (t.includes('orthogym') || t.includes('tep')) return {cls:'b-o', label:'Orthogym'};
  if (t.includes('hockergym') || t.includes('atemgym')) return {cls:'b-h', label:'Hockergym'};
  if (t.includes('nacken')) return {cls:'b-n', label:'RNS'};
  return {cls:'b-r', label:'Rücken'};
}

function getRaum(k) {
  const raum = wert(k, ['kursraum','Kursraum','raum','Raum','ort','Ort']);
  const r = String(raum ?? '').trim();
  if (!r) return '';
  if (r.toLowerCase() === 'kursraum c' || r.toLowerCase() === 'raum c' || r.toLowerCase() === 'c') return 'C';
  return r;
}

function raumHTML(raum) {
  if (!raum) return '';
  if (raum === 'C') return '<div class="room-badge">C</div>';
  return '<div class="room-badge room-badge-text">' + htmlEscape(raum) + '</div>';
}

function karteHTML(k) {
  const von = normalisiereZeit(wert(k, ['uhrzeit_von','Uhrzeit_von','UhrzeitVon','von','Von']));
  const bis = normalisiereZeit(wert(k, ['uhrzeit_bis','Uhrzeit_bis','UhrzeitBis','bis','Bis']));
  const kursname = wert(k, ['kursname','Kursname','kurs','Kurs','name','Name']);
  const trainer = wert(k, ['trainer','Trainer']);
  const hinweis = wert(k, ['hinweis','Hinweis']);
  const typ = wert(k, ['kurstyp','Kurstyp','typ','Typ']);
  const raum = getRaum(k);
  const vm = istVormittag(von);
  const badge = getBadge(typ || kursname);

  return '<div class="kurs-card ' + (vm ? '' : 'nachmittag') + '">' +
    '<div class="kurs-zeit">' + htmlEscape(von) + ' – ' + htmlEscape(bis) + ' Uhr</div>' +
    '<div class="kurs-name">' + htmlEscape(kursname) + '</div>' +
    '<div class="kurs-trainer">' + htmlEscape(trainer) + '</div>' +
    (hinweis ? '<div class="kurs-hinweis">' + htmlEscape(hinweis) + '</div>' : '') +
    '<div class="kurs-footer">' +
      '<span class="typ-badge ' + badge.cls + '">' + badge.label + '</span>' +
      raumHTML(raum) +
    '</div>' +
  '</div>';
}

function sortiereKurse(a, b) {
  const av = normalisiereZeit(wert(a, ['uhrzeit_von','Uhrzeit_von','UhrzeitVon','von','Von']));
  const bv = normalisiereZeit(wert(b, ['uhrzeit_von','Uhrzeit_von','UhrzeitVon','von','Von']));
  return av.localeCompare(bv);
}

function renderDesktop() {
  const grid = document.getElementById('planGrid');
  if (!alleKurse.length) {
    grid.innerHTML = '<div class="laden">Kurse werden geladen...</div>';
    return;
  }

  const heuteTag = WOCHENTAG_MAP[new Date().getDay()] || '';
  grid.innerHTML = TAGE.map(tag => {
    const kurse = alleKurse.filter(k => tagVonKurs(k) === tag).sort(sortiereKurse);
    const vm = kurse.filter(k => istVormittag(wert(k, ['uhrzeit_von','Uhrzeit_von','UhrzeitVon','von','Von'])));
    const nm = kurse.filter(k => !istVormittag(wert(k, ['uhrzeit_von','Uhrzeit_von','UhrzeitVon','von','Von'])));
    const istHeute = tag === heuteTag;

    return '<div class="tag-spalte">' +
      '<div class="tag-header ' + (istHeute ? 'heute' : '') + '">' + htmlEscape(tag) + (istHeute ? ' ●' : '') + '</div>' +
      vm.map(karteHTML).join('') +
      (vm.length && nm.length ? '<hr class="trennlinie">' : '') +
      nm.map(karteHTML).join('') +
      (!kurse.length ? '<div class="leer-tag">Keine Kurse</div>' : '') +
    '</div>';
  }).join('');
}

function renderMobile() {
  const tag = aktiverTag();
  const el = document.getElementById('planSingle');
  const kurse = alleKurse.filter(k => tagVonKurs(k) === tag).sort(sortiereKurse);

  if (!kurse.length) {
    el.innerHTML = '<div class="leer-tag">Keine Kurse an diesem Tag</div>';
  } else {
    el.innerHTML = '<div class="tag-spalte">' + kurse.map(karteHTML).join('') + '</div>';
  }
  updateMobileHeader();
}

function navigiere(richtung) {
  const neu = aktiverIndex + richtung;
  if (neu >= 0 && neu <= 4) {
    aktiverIndex = neu;
    renderMobile();
  }
}

function zuHeute() {
  aktiverIndex = heuteIndex();
  renderMobile();
}

window.addEventListener('message', function(event) {
  if (event.data && event.data.type === 'kurse' && Array.isArray(event.data.daten)) {
    alleKurse = event.data.daten;
    aktiverIndex = heuteIndex();
    renderDesktop();
    renderMobile();
  }
});

window.addEventListener('load', function() {
  aktiverIndex = heuteIndex();
  updateMobileHeader();
  window.parent.postMessage({ type: 'bereit' }, '*');
});
</script>
</body>
</html>
